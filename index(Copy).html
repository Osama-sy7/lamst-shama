<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لمسة شمع | Candle Touch</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --primary-pink: #f4b6c2; --deep-pink: #d9788f; --bg-cream: #fff5f6; }
    * { box-sizing: border-box; font-family: 'Cairo', sans-serif; transition: all 0.2s ease; }
    body { background: var(--bg-cream); margin: 0; padding-bottom: 60px; color: #4a3e3d; }

    .top-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, 0.95); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .nav-title { font-size: 14px; font-weight: 800; color: var(--deep-pink); }
    .nav-actions { display: flex; gap: 8px; align-items: center; }
    
    .icon-btn { background: #ffffff; border: 1px solid #f2c4d0; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; position: relative; text-decoration: none; color: inherit; }
    
    /* Instagram Official SVG Icon Style */
    .insta-btn {
      background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%,#d6249f 60%,#285AEB 90%);
      border: none;
    }
    .insta-btn svg { width: 18px; height: 18px; fill: white; }

    .badge { position: absolute; top: -3px; right: -3px; background: var(--deep-pink); color: white; border-radius: 50%; font-size: 9px; width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; font-weight: bold; }

    .search-box { display: none; padding: 6px 12px; background: #fff; border-bottom: 1px solid #f2d6dc; }
    .search-box input { width: 100%; padding: 6px 12px; border-radius: 15px; border: 1px solid #e0b8c0; outline: none; font-size: 12px; }

    .hero-banner { background: linear-gradient(135deg, #fce4e8 0%, #f3cad2 100%); margin: 8px 12px; padding: 12px 10px; border-radius: 15px; text-align: center; }
    .hero-title { font-family: 'Reem Kufi', sans-serif; font-size: 24px; color: var(--deep-pink); margin: 0; }
    .hero-sub { font-size: 11px; color: #8a5763; margin-top: 2px; font-weight: 600; }

    .container { padding: 0 12px; }
    .section-title { font-size: 14px; font-weight: 700; color: var(--deep-pink); margin: 10px 0 8px; display: flex; align-items: center; justify-content: space-between; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .card { background: #ffffff; border-radius: 14px; padding: 8px; box-shadow: 0 4px 12px rgba(217, 120, 143, 0.12); border: 1px solid #f5e1e5; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
    .card img { width: 100%; height: 105px; object-fit: cover; border-radius: 10px; cursor: pointer; }
    .card-title { font-weight: 700; font-size: 13px; margin: 6px 0 2px; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-desc { font-size: 10px; color: #777; margin-bottom: 6px; height: 26px; overflow: hidden; line-height: 1.3; }
    
    .price-box { margin-bottom: 6px; }
    .old-price { text-decoration: line-through; font-size: 10px; color: #999; display: block; margin-bottom: -2px; }
    .curr-price { font-weight: 800; font-size: 14px; color: var(--deep-pink); }
    
    .btn-group { display: flex; gap: 4px; }
    .btn-action { flex: 1; padding: 6px 4px; border: none; border-radius: 8px; font-weight: bold; font-size: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 2px; }
    .btn-cart { background: #fce4e8; color: var(--deep-pink); }
    .btn-buy { background: #25D366; color: #fff; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(3px); z-index: 200; justify-content: center; align-items: center; padding: 15px; }
    .modal-content { background: #fff; width: 100%; max-width: 360px; border-radius: 18px; padding: 15px; }
    .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; font-size: 12px; }
    .cart-item img { width: 38px; height: 38px; border-radius: 8px; object-fit: cover; }
    .btn-checkout { background: #25D366; color: white; border: none; width: 100%; padding: 10px; border-radius: 10px; font-weight: bold; font-size: 13px; margin-top: 12px; cursor: pointer; }

    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 300; justify-content: center; align-items: center; flex-direction: column; padding: 15px; }
    .lightbox img { max-width: 90%; max-height: 80vh; border-radius: 15px; }
    .lightbox-close { margin-top: 15px; background: var(--deep-pink); color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; }

    #toast { visibility: hidden; min-width: 250px; background-color: var(--deep-pink); color: #fff; text-align: center; border-radius: 20px; padding: 10px 14px; position: fixed; z-index: 400; left: 50%; bottom: 20px; transform: translateX(-50%); font-size: 12px; font-weight: bold; }
    #toast.show { visibility: visible; animation: fadein 0.3s, fadeout 0.3s 2.7s; }
    @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 20px; opacity: 1;} }
    @keyframes fadeout { from {bottom: 20px; opacity: 1;} to {bottom: 0; opacity: 0;} }
  </style>
</head>
<body>

  <div class="top-header">
    <div class="nav-title">🌸 لمسة شمع</div>
    <div class="nav-actions">
      <!-- أيقونة إنستغرام الرسمية الفخمة -->
      <a href="https://www.instagram.com/11yasemin.mum?utm_source=qr&igsh=MWUzMnN4bWMxZTAwdA==" target="_blank" class="icon-btn insta-btn" title="حساب إنستغرام">
        <svg viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
      </a>
      <button class="icon-btn" onclick="toggleSearch()">🔍</button>
      <button class="icon-btn" onclick="toggleFavFilter()">💖 <span class="badge" id="favBadge">0</span></button>
      <button class="icon-btn" onclick="openCart()">🛒 <span class="badge" id="cartBadge">0</span></button>
    </div>
  </div>

  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" onkeyup="searchProducts()" placeholder="ابحث باسم الشمعة...">
  </div>

  <div class="hero-banner">
    <h1 class="hero-title">لمسة شمع</h1>
    <div class="hero-sub">✨ نور.. يلامس قلبك ✨</div>
  </div>

  <div class="container">
    <div class="section-title">
      <span id="gridTitle">🕯️ جميع العروض والشموع</span>
      <button id="resetFilterBtn" onclick="resetFilter()" style="display:none; border:none; background:none; color:var(--deep-pink); font-weight:bold; font-size:11px; cursor:pointer;">عرض الكل 🔄</button>
    </div>
    <div class="grid" id="productsGrid"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <img id="zoomImg" src="" alt="معاينة الصورة">
    <button class="lightbox-close" onclick="closeZoom()">إغلاق ❌</button>
  </div>

  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h4 style="margin:0; color:var(--deep-pink);">🛒 سلة المشتريات</h4>
        <button onclick="closeCart()" style="border:none; background:none; font-size:16px; cursor:pointer;">❌</button>
      </div>
      <div id="cartItemsList" style="margin-top:10px;"></div>
      <button class="btn-checkout" onclick="checkoutAll()">إرسال الطلب الكامل عبر الواتساب 💬</button>
    </div>
  </div>

  <div id="toast">تم الإجراء بنجاح!</div>

  <script>
    let products = JSON.parse(localStorage.getItem("ls_products")) || [];
    let whatsappNumber = localStorage.getItem("ls_whatsapp") || ""; // فارغ بشكل افتراضي
    let cart = [];
    let favorites = [];
    let showOnlyFavs = false;

    function showToast(text) {
      const toast = document.getElementById("toast");
      toast.innerText = text;
      toast.className = "show";
      setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3200);
    }

    function renderGrid(list = products) {
      const grid = document.getElementById("productsGrid");
      grid.innerHTML = "";
      if (list.length === 0) {
        grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #888; font-size: 12px; margin: 20px 0;">لا توجد نتائج مطابقة.</p>`;
        return;
      }
      list.forEach(p => {
        const isFav = favorites.includes(p.id);
        const discountHTML = p.discountPrice 
          ? `<span class="old-price">${p.price} TL</span><span class="curr-price">${p.discountPrice} TL</span>`
          : `<span class="curr-price">${p.price} TL</span>`;

        grid.innerHTML += `
          <div class="card">
            <button class="icon-btn" style="position:absolute; top:12px; left:12px; width:26px; height:26px; font-size:11px;" onclick="toggleFav(${p.id})">
              ${isFav ? '💖' : '🤍'}
            </button>
            <img src="${p.img || 'https://via.placeholder.com/150'}" alt="${p.name}" onclick="zoomImage('${p.img}')">
            <div class="card-title">${p.name}</div>
            <div class="card-desc">${p.desc || ''}</div>
            <div class="price-box">${discountHTML}</div>
            <div class="btn-group">
              <button class="btn-action btn-cart" onclick="addToCart(${p.id})">🛒 للسلة</button>
              <button class="btn-action btn-buy" onclick="singleOrder(${p.id})">💬 طلب</button>
            </div>
          </div>
        `;
      });
    }

    function zoomImage(url) {
      if(!url) return;
      document.getElementById("zoomImg").src = url;
      document.getElementById("lightbox").style.display = "flex";
    }
    function closeZoom() { document.getElementById("lightbox").style.display = "none"; }

    function addToCart(id) {
      const prod = products.find(p => p.id === id);
      cart.push(prod);
      document.getElementById("cartBadge").innerText = cart.length;
      showToast(`تمت إضافة "${prod.name}" للسلة`);
    }

    function toggleFav(id) {
      if (favorites.includes(id)) {
        favorites = favorites.filter(fId => fId !== id);
      } else {
        favorites.push(id);
      }
      document.getElementById("favBadge").innerText = favorites.length;
      if (showOnlyFavs) filterFavs(); else renderGrid();
    }

    function toggleFavFilter() {
      showOnlyFavs = !showOnlyFavs;
      if (showOnlyFavs) {
        document.getElementById("gridTitle").innerText = "💖 الشموع المفضلة لديك";
        document.getElementById("resetFilterBtn").style.display = "inline";
        renderGrid(products.filter(p => favorites.includes(p.id)));
      } else resetFilter();
    }

    function resetFilter() {
      showOnlyFavs = false;
      document.getElementById("gridTitle").innerText = "🕯️ جميع العروض والشموع";
      document.getElementById("resetFilterBtn").style.display = "none";
      renderGrid(products);
    }

    function singleOrder(id) {
      // التحقق من وجود رقم الهاتف
      if (!whatsappNumber || whatsappNumber.trim() === "") {
        return showToast("هناك تحديث على المعلومات والأسعار، يمكن الطلب لاحقاً");
      }
      const p = products.find(item => item.id === id);
      const price = p.discountPrice || p.price;
      const orderText = encodeURIComponent(`مرحباً لمسة شمع 🕯️\nطلب شمعة: ${p.name}\nالسعر: ${price} TL`);
      window.open(`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${orderText}`, '_blank');
    }

    function openCart() {
      const list = document.getElementById("cartItemsList");
      list.innerHTML = "";
      if (cart.length === 0) {
        list.innerHTML = "<p style='text-align:center; font-size:12px; color:#888;'>السلة فارغة حالياً.</p>";
      } else {
        cart.forEach((item, index) => {
          list.innerHTML += `
            <div class="cart-item">
              <img src="${item.img}" alt="${item.name}">
              <div style="flex:1; margin-right:8px;">
                <div style="font-weight:bold;">${item.name}</div>
                <div style="color:var(--deep-pink); font-weight:bold;">${item.discountPrice || item.price} TL</div>
              </div>
              <button onclick="removeFromCart(${index})" style="border:none; background:none; cursor:pointer;">🗑️</button>
            </div>
          `;
        });
      }
      document.getElementById("cartModal").style.display = "flex";
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      document.getElementById("cartBadge").innerText = cart.length;
      openCart();
    }

    function closeCart() { document.getElementById("cartModal").style.display = "none"; }

    function checkoutAll() {
      if (cart.length === 0) return showToast("السلة فارغة!");
      if (!whatsappNumber || whatsappNumber.trim() === "") {
        return showToast("هناك تحديث على المعلومات والأسعار، يمكن الطلب لاحقاً");
      }
      let names = cart.map((item, i) => `${i+1}. ${item.name} (${item.discountPrice || item.price} TL)`).join("\n");
      let summary = encodeURIComponent(`مرحباً لمسة شمع 🕯️ أود طلب الشموع التالية:\n${names}`);
      window.open(`https://api.whatsapp.com/send?phone=${whatsappNumber}&text=${summary}`, '_blank');
    }

    function toggleSearch() {
      const box = document.getElementById("searchBox");
      box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function searchProducts() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();
      renderGrid(products.filter(p => p.name.toLowerCase().includes(query)));
    }

    window.addEventListener("storage", () => {
      products = JSON.parse(localStorage.getItem("ls_products")) || [];
      whatsappNumber = localStorage.getItem("ls_whatsapp") || "";
      renderGrid();
    });

    renderGrid();
  </script>
</body>
</html>
